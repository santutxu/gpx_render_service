[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E","F","W","C90","I","N","UP","S","BLE","B","A","C4","TCH","TID","Q","FLY","PERF","RUF","SIM"]
ignore = ["S603","S310","S324","S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
